<style>
:root {
  --bg: #EDF0FC; --surface: #FFFFFF; --surface-2: #F6F7FE; --ink: #15183A; --muted: #575D86;
  --line: #D8DCF1; --hot: #F23D1C; --hot-ink: #FFFFFF; --sun: #FFC23C; --sun-ink: #2A1E00;
  --turf: #0E8F50; --turf-soft: #DDF5E8; --loss-soft: #FDE4DE; --shadow: 0 2px 0 #15183A; --edge: #15183A;
  --display: "Bungee", "Arial Black", Impact, sans-serif;
  --body: "Schibsted Grotesk", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C0E2B; --surface: #181B44; --surface-2: #1F2352; --ink: #F2F3FF; --muted: #A6ABD8;
    --line: #2E3270; --hot: #FF5A3A; --sun: #FFCB55; --turf: #36D487; --turf-soft: #123A2B;
    --loss-soft: #3E1D24; --shadow: 0 2px 0 #000000; --edge: #05061A;
  }
}
:root[data-theme="dark"] {
  --bg: #0C0E2B; --surface: #181B44; --surface-2: #1F2352; --ink: #F2F3FF; --muted: #A6ABD8;
  --line: #2E3270; --hot: #FF5A3A; --sun: #FFCB55; --turf: #36D487; --turf-soft: #123A2B;
  --loss-soft: #3E1D24; --shadow: 0 2px 0 #000000; --edge: #05061A;
}
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: var(--body); font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
img { max-width: 100%; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap { max-width: 880px; margin: 0 auto; padding: 16px 16px 48px; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 14px; color: var(--muted); }
.updated { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.btn { border: 2px solid var(--ink); background: var(--surface); border-radius: 999px; padding: 4px 14px; font-weight: 700; font-size: 14px; cursor: pointer; box-shadow: var(--shadow); }
.btn:active { transform: translateY(2px); box-shadow: none; }
.btn[disabled] { opacity: .6; cursor: default; }

/* hero */
.hero { position: relative; margin: 20px 0 0; padding: 28px 24px 24px; background: var(--hot); color: var(--hot-ink); border: 3px solid var(--edge); border-radius: 22px; box-shadow: 0 6px 0 var(--edge); overflow: hidden; }
.hero::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 58px, rgba(255,255,255,.12) 58px 61px); pointer-events: none; }
.tag { display: inline-block; position: relative; z-index: 1; background: var(--sun); color: var(--sun-ink); font-family: var(--display); font-size: clamp(16px, 3.6vw, 22px); padding: 4px 12px 2px; border: 3px solid var(--edge); border-radius: 10px; transform: rotate(-4deg); box-shadow: 3px 3px 0 var(--edge); }
.wordmark { position: relative; z-index: 1; margin: 6px 0 0; font-family: var(--display); font-weight: 400; font-size: clamp(56px, 15vw, 128px); line-height: .9; letter-spacing: -.01em; text-shadow: 4px 4px 0 var(--edge); }
.sub-wordmark { position: relative; z-index: 1; margin: 8px 0 0; font-weight: 800; font-size: clamp(16px, 3.4vw, 20px); }
.lede { position: relative; z-index: 1; margin: 14px 0 0; max-width: 56ch; font-size: 17px; font-weight: 500; }

/* ticker */
.ticker { margin: 16px 0 0; background: var(--ink); color: var(--bg); border-radius: 14px; overflow: hidden; display: flex; align-items: stretch; }
.ticker-label { flex: none; background: var(--sun); color: var(--sun-ink); font-family: var(--display); font-size: 14px; padding: 10px 12px; display: flex; align-items: center; }
.ticker-view { flex: 1; overflow: hidden; position: relative; }
.ticker-track { display: inline-flex; gap: 40px; padding: 10px 20px; white-space: nowrap; font-weight: 700; font-size: 15px; animation: roll var(--dur, 40s) linear infinite; }
.ticker-view:hover .ticker-track { animation-play-state: paused; }
@keyframes roll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce) {
  .ticker-track { animation: none; white-space: normal; flex-wrap: wrap; gap: 6px 24px; }
  .ticker-track [aria-hidden="true"] { display: none; }
}

/* winner */
.winner { margin: 16px 0 0; display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: var(--sun); color: var(--sun-ink); border: 3px solid var(--edge); border-radius: 18px; box-shadow: 0 4px 0 var(--edge); }
.winner-copy { flex: 1; min-width: 0; }
.winner-copy p { margin: 0; font-size: 14px; font-weight: 600; }
.winner-copy h2 { margin: 2px 0; font-family: var(--display); font-weight: 400; font-size: clamp(18px, 4vw, 24px); line-height: 1.15; }
.winner-x { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--edge); background: #FFFFFF; color: #15183A; font-size: 20px; line-height: 1; cursor: pointer; }

/* tabs */
.tabs { margin: 22px 0 16px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; background: var(--surface); border: 2px solid var(--ink); border-radius: 16px; padding: 6px; box-shadow: var(--shadow); }
.tab { border: 0; background: transparent; border-radius: 11px; padding: 10px 6px; font-weight: 800; font-size: 15px; cursor: pointer; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.tab:not([aria-selected="true"]):hover { color: var(--ink); background: var(--surface-2); }

.card { background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 18px; margin: 0 0 16px; }
.h2 { margin: 0 0 4px; font-family: var(--display); font-weight: 400; font-size: 22px; line-height: 1.2; }
.note { margin: 0 0 12px; color: var(--muted); font-size: 14px; }

/* week picker */
.weeks { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 10px; margin: 0 0 6px; }
.wk { flex: none; min-width: 42px; height: 42px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); font-weight: 800; cursor: pointer; }
.wk.is-final { border-color: var(--ink); }
.wk.is-live { border-color: var(--hot); color: var(--hot); }
.wk.is-upcoming { color: var(--muted); }
.wk[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.status { display: flex; align-items: center; gap: 8px; margin: 0 0 14px; font-size: 14px; color: var(--muted); font-weight: 600; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
.dot.is-live { background: var(--hot); box-shadow: 0 0 0 4px color-mix(in srgb, var(--hot) 25%, transparent); }
.dot.is-final { background: var(--turf); }

/* money ticket */
.ticket { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: var(--surface-2); border: 2px dashed var(--line); margin: 0 0 14px; }
.ticket-emoji { font-size: 22px; line-height: 1.2; }
.ticket p { margin: 0; }

/* games */
.games { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.game { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 10px; border-radius: 14px; background: var(--surface-2); }
.side { display: flex; align-items: center; gap: 10px; min-width: 0; padding: 6px 8px; border-radius: 10px; }
.side.is-right { flex-direction: row-reverse; text-align: right; }
.side.is-win { background: var(--turf-soft); }
.who-text { min-width: 0; display: flex; flex-direction: column; }
.who-name { font-weight: 800; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who-team { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.score { margin-left: auto; font-family: var(--display); font-size: 20px; font-variant-numeric: tabular-nums; }
.side.is-right .score { margin-left: 0; margin-right: auto; }
.side.is-win .score { color: var(--turf); }
.scorebox { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; line-height: 1.15; }
.side.is-right .scorebox { margin-left: 0; margin-right: auto; align-items: flex-start; }
.scorebox .score { margin: 0; }
.proj { font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.proj.is-done { font-weight: 600; }
.game-foot { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 13px; color: var(--muted); padding: 2px 8px 0; }
.flip { font-size: 12px; font-weight: 800; padding: 2px 10px; border-radius: 999px; background: var(--sun); color: var(--sun-ink); }
.vs { font-size: 12px; font-weight: 800; color: var(--muted); text-align: center; }
.vs b { display: block; font-size: 13px; color: var(--ink); }

.av { flex: none; display: inline-grid; place-items: center; border-radius: 50%; background: var(--c); color: #fff; font-weight: 800; object-fit: cover; border: 2px solid var(--edge); }

/* standings */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 13px; color: var(--muted); font-weight: 700; padding: 8px; border-bottom: 2px solid var(--line); white-space: nowrap; }
td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.num { text-align: right; white-space: nowrap; }
.rank { font-family: var(--display); font-size: 18px; width: 36px; }
.who { display: flex; align-items: center; gap: 10px; min-width: 150px; }
tr.is-cut td { border-bottom: 3px dashed var(--hot); }
.badge { display: inline-block; font-size: 11px; font-weight: 800; padding: 1px 8px; border-radius: 999px; background: var(--sun); color: var(--sun-ink); margin-left: 6px; vertical-align: 1px; }
.luck { font-size: 12px; color: var(--muted); }
.cut-label { font-size: 12px; font-weight: 800; color: var(--hot); }

/* money */
.prizes { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.prize { border: 2px solid var(--line); border-radius: 16px; padding: 14px; background: var(--surface-2); display: flex; flex-direction: column; gap: 2px; }
.prize.gold { background: var(--sun); color: var(--sun-ink); border-color: var(--edge); }
.prize-amt { font-family: var(--display); font-size: 30px; line-height: 1.1; }
.prize-label { font-weight: 700; font-size: 14px; }
.prize-sub { font-size: 13px; opacity: .8; }
.settle { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.settle li { display: grid; grid-template-columns: 1fr auto 1fr auto; align-items: center; gap: 10px; padding: 10px 12px; background: var(--surface-2); border-radius: 12px; }
.amt { font-family: var(--display); font-size: 18px; }
.up { color: var(--turf); font-weight: 800; }
.down { color: var(--hot); font-weight: 800; }
.ledger { list-style: none; margin: 0; padding: 0; }
.ledger li { display: flex; gap: 12px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--line); }
.chip { flex: none; font-weight: 800; font-size: 12px; background: var(--ink); color: var(--bg); border-radius: 6px; padding: 1px 8px; }


/* bench crimes + awards */
.rap td { vertical-align: middle; }
.rap .left { font-family: var(--display); font-size: 18px; color: var(--hot); }
.ls { display: inline-block; min-width: 22px; text-align: center; font-weight: 800; border-radius: 6px; padding: 0 6px; background: var(--loss-soft); color: var(--hot); }
.ls.zero { background: transparent; color: var(--muted); font-weight: 600; }
.shame { list-style: none; margin: 0; padding: 0; counter-reset: s; display: grid; gap: 8px; }
.shame li { counter-increment: s; display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); }
.shame li::before { content: counter(s); font-family: var(--display); font-size: 20px; color: var(--hot); text-align: center; }
.shame p { margin: 0; font-size: 14px; }
.shame .gain { font-family: var(--display); font-size: 18px; color: var(--hot); white-space: nowrap; }
.perp { display: grid; gap: 10px; list-style: none; margin: 0; padding: 0; }
.perp li { border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; background: var(--surface-2); }
.perp .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.perp .nums { margin-left: auto; text-align: right; font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); }
.perp .nums b { color: var(--hot); font-family: var(--display); font-weight: 400; font-size: 18px; margin-left: 6px; }
.perp .why { margin: 8px 0 0; font-size: 14px; }
.perp .clean { color: var(--turf); font-weight: 700; }
.flag { display: inline-block; font-size: 12px; font-weight: 800; padding: 2px 10px; border-radius: 999px; background: var(--hot); color: #fff; }
.awards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.award { position: relative; border: 2px solid var(--line); border-radius: 18px; padding: 16px; background: var(--surface); display: flex; flex-direction: column; gap: 8px; }
.award.hero-award { border-color: var(--edge); background: var(--sun); color: var(--sun-ink); box-shadow: 0 4px 0 var(--edge); }
.award.hero-award .who-team, .award.hero-award .award-detail { color: var(--sun-ink); opacity: .85; }
.award-emoji { font-size: 30px; line-height: 1; }
.award-title { margin: 0; font-family: var(--display); font-weight: 400; font-size: 17px; line-height: 1.2; }
.award .who { gap: 10px; }
.award-stat { font-family: var(--display); font-size: 26px; line-height: 1; }
.award-detail { margin: 0; font-size: 14px; color: var(--muted); }

.section-head { margin: 28px 0 12px; font-family: var(--display); font-weight: 400; font-size: clamp(24px, 5vw, 32px); line-height: 1.1; }
.section-head:first-child { margin-top: 4px; }
.awards { margin-bottom: 8px; }
/* rules */
.rules { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.rules li { display: flex; gap: 12px; }
.rules .ico { flex: none; width: 28px; text-align: center; font-size: 20px; }
.rules p { margin: 0; }
.foot { color: var(--muted); font-size: 13px; margin-top: 8px; }
.vote { background: var(--loss-soft); border-radius: 12px; padding: 12px 14px; margin-top: 14px; }

@media (max-width: 560px) {
  .wrap { padding: 12px 12px 40px; }
  .hero { padding: 22px 18px 20px; }
  .tab { font-size: 13px; padding: 9px 2px; }
  .game { grid-template-columns: 1fr; gap: 2px; }
  .vs { text-align: left; padding-left: 8px; }
  .vs b { display: inline; margin-left: 6px; }
  .side.is-right { flex-direction: row; text-align: left; }
  .side.is-right .score { margin-left: auto; margin-right: 0; }
  .side.is-right .scorebox { margin-left: auto; margin-right: 0; align-items: flex-end; }
  .settle li { grid-template-columns: 1fr auto; }
  .settle .arrow { display: none; }
}

function weekFacts(wk) {

  weeks.filter(w => w.status === "final").forEach(wk => {

      if (x.pts > y.pts) s[x.u].aw++; else if (x.pts < y.pts) s[x.u].al++; else s[x.u].at++;

}

  const out = []; let i = 0, j = 0;
  while (i < debt.length && j < cred.length) {
    const amt = Math.min(debt[i].left, cred[j].left);
    if (amt > 0) out.push({ from: debt[i].u, to: cred[j].u, amount: amt });
    debt[i].left -= amt; cred[j].left -= amt;
    if (!debt[i].left) i++; if (!cred[j].left) j++;

}

      if (flips.length) lines.push(`📈 Projected comebacks: ${flips.join(", ")}`);

    if (f.bottom.length === 1) lines.push(`📉 Week ${live.week} low so far: ${nm(f.bottom[0].u)} with ${f2(f.bottom[0].pts)}. The $5 is on the line`);
  }
  if (all.length) {
    const hi = all.reduce((a, b) => b.pts > a.pts ? b : a), lo = all.reduce((a, b) => b.pts < a.pts ? b : a);
    lines.push(`🔥 Season high: ${nm(hi.u)} dropped ${f2(hi.pts)} in Week ${hi.week}`);
    lines.push(`🧊 Season low: ${nm(lo.u)} managed ${f2(lo.pts)} in Week ${lo.week}`);
    const close = games.reduce((a, b) => b.margin < a.margin ? b : a), blow = games.reduce((a, b) => b.margin > a.margin ? b : a);
    const w = g => g.as > g.bs ? [g.a, g.b] : [g.b, g.a];
    lines.push(`😬 Closest game: ${nm(w(close)[0])} over ${nm(w(close)[1])} by ${f2(close.margin)} in Week ${close.week}`);
    lines.push(`💀 Biggest blowout: ${nm(w(blow)[0])} over ${nm(w(blow)[1])} by ${f2(blow.margin)} in Week ${blow.week}`);
    const st = standings(weeks);
    const unbeaten = st.filter(r => r.l === 0 && r.w > 0).map(r => nm(r.u));
    const winless = st.filter(r => r.w === 0 && r.l > 0).map(r => nm(r.u));
    if (unbeaten.length) lines.push(`🏆 Still undefeated: ${unbeaten.join(", ")}`);
    if (winless.length) lines.push(`🫠 Still looking for a W: ${winless.join(", ")}`);
    if (finals.some(w => w.lineups)) {
      const { rows, swaps } = seasonCrimes(weeks);
      if (rows[0] && rows[0].left > 0) lines.push(`🚨 Most points left on the bench: ${nm(rows[0].u)} with ${f2(rows[0].left)}`);
      if (swaps[0]) lines.push(`🤦 Worst call of the year: ${nm(swaps[0].u)} started ${pname(swaps[0].out)} over ${pname(swaps[0].inn)} in Week ${swaps[0].week}`);
    }
  }
  return lines.length ? lines : ["🏈 Kickoff is coming. Set your lineups"];
}

function ticket(emoji, html) { return `<div class="ticket"><span class="ticket-emoji" aria-hidden="true">${emoji}</span><p>${html}</p></div>`; }

function renderWeek() {
  const d = state.data, wk = d.weeks[state.week - 1];
  const picker = `<div class="weeks" role="group" aria-label="Choose a week">${d.weeks.map(w =>
    `<button class="wk is-${w.status}" data-week="${w.week}" aria-pressed="${w.week === state.week}" aria-label="Week ${w.week}, ${w.status}">${w.week}</button>`).join("")}</div>`;
  const statusText = wk.status === "upcoming" ? `Week ${wk.week} hasn't started.`
    : wk.status === "live" ? `Week ${wk.week} is in progress. Scores can still move.` : `Week ${wk.week} is final.`;
  let body = "";
  if (!wk.games.length) body = ticket("⏳", "Matchups show up here once the week starts.");
  else {
    const f = weekFacts(wk);
    let t;
    if (wk.status === "live") t = ticket("📺", `Highest right now: <strong>${f.top.map(x => esc(nm(x.u))).join(" and ")}</strong> (${f2(f.top[0].pts)}). Lowest right now: <strong>${f.bottom.map(x => esc(nm(x.u))).join(" and ")}</strong> (${f2(f.bottom[0].pts)}). The $${L.weeklyBet} settles when the week is final.${(() => {
      if (!wk.proj) return "";
      const pr = Object.entries(wk.proj).map(([u, p]) => ({ u, pts: p.pts }));
      if (pr.length < 2) return "";
      const lo = pr.reduce((a, b) => b.pts < a.pts ? b : a), hi = pr.reduce((a, b) => b.pts > a.pts ? b : a);
      const changed = lo.u !== f.bottom[0].u || hi.u !== f.top[0].u;
      return changed ? ` <br>📈 Projected finish: <strong>${esc(nm(lo.u))}</strong> (${f2(lo.pts)}) pays <strong>${esc(nm(hi.u))}</strong> (${f2(hi.pts)}).` : "";
    })()}`);
    else if (wk.status === "upcoming") t = ticket("⏳", "Scores show up once games start.");
    else if (f.top.length !== 1 || f.bottom.length !== 1) t = ticket("🤝", `Tie for highest or lowest score. The commissioner decides this week's $${L.weeklyBet}.`);
    else t = ticket("💸", `<strong>${esc(nm(f.bottom[0].u))}</strong> (${f2(f.bottom[0].pts)}) pays <strong>${esc(nm(f.top[0].u))}</strong> (${f2(f.top[0].pts)}) $${L.weeklyBet}.`);
    const games = wk.games.map(g => {
      const aw = wk.status !== "upcoming" && g.as > g.bs, bw = wk.status !== "upcoming" && g.bs > g.as;
      const margin = Math.abs(g.as - g.bs);
      const pj = wk.status !== "final" && wk.proj ? wk.proj : null;
      const projLine = u => {
        if (!pj || !pj[u]) return "";
        const p = pj[u];
        if (wk.status === "live" && !p.left.length) return `<span class="proj is-done">Done</span>`;
        return `<span class="proj">Proj ${f2(p.pts)}${p.unknown.length ? "+" : ""}</span>`;
      };
      const side = (u, pts, win, right) => `<div class="side${right ? " is-right" : ""}${win ? " is-win" : ""}">${avatar(u)}${whoBlock(u)}<span class="scorebox"><span class="score">${wk.status === "upcoming" && pj && pj[u] ? "-" : f2(pts)}</span>${projLine(u)}</span>${win ? `<span class="sr">${wk.status === "live" ? "leading" : "won"}</span>` : ""}</div>`;
      let foot = "";
      if (pj && pj[g.a] && pj[g.b]) {
        const bits = [];
        if (wk.status === "live") {
        } else {
          const fav = pj[g.a].pts >= pj[g.b].pts ? g.a : g.b;
          bits.push(`<span>${esc(nm(fav))} projected by ${f2(Math.abs(pj[g.a].pts - pj[g.b].pts))}</span>`);
        }
        const unk = [...pj[g.a].unknown, ...pj[g.b].unknown];
        if (unk.length) bits.push(`<span>+ no projection for ${unk.map(esc).join(", ")}</span>`);
        if (bits.length) foot = `<div class="game-foot">${bits.join("")}</div>`;
      }
      return `<li class="game">${side(g.a, g.as, aw, false)}<span class="vs">vs${wk.status !== "upcoming" && margin ? `<b>${wk.status === "live" ? "gap " : "by "}${f2(margin)}</b>` : ""}</span>${side(g.b, g.bs, bw, true)}${foot}</li>`;
    }).join("");
    body = t + `<ul class="games">${games}</ul>`;
  }
  return `${picker}<p class="status"><span class="dot is-${wk.status}" aria-hidden="true"></span>${statusText}</p>
    <section class="card"><h2 class="h2">Week ${wk.week} matchups</h2><p class="note">Lowest score pays the highest score $${L.weeklyBet}, Weeks 1 to ${L.regWeeks}.</p>${body}</section>`;
}

/* ---------- lineups: bench crimes + awards ---------- */
const SLOTS = ["QB","RB","RB","WR","WR","TE","FLEX","K","DEF"];
const isTeamDef = id => /^[A-Z]{2,3}$/.test(id);
const posOf = id => PLAYERS[id] ? PLAYERS[id][1] : isTeamDef(id) ? "DEF" : "?";
const pname = id => PLAYERS[id] ? PLAYERS[id][0] : isTeamDef(id) ? `${id} D/ST` : "Unknown player";
const fits = (slot, pos) => slot === "FLEX" ? ["RB","WR","TE"].includes(pos) : pos === slot;

function analyze(lu) {
  const p = lu.p, starters = lu.s.filter(Boolean);
  const actual = Math.round(starters.reduce((a, id) => a + (p[id] || 0), 0) * 100) / 100;
  const pool = Object.entries(p).sort((a, b) => b[1] - a[1]);
  const used = new Set(); let best = 0;
  ["QB","TE","K","DEF","RB","RB","WR","WR","FLEX"].forEach(slot => {
    const hit = pool.find(([id]) => !used.has(id) && fits(slot, posOf(id)));
    if (hit) { used.add(hit[0]); best += hit[1]; }
  });
  best = Math.max(actual, Math.round(best * 100) / 100);
  let swap = null;
  lu.s.forEach((out, k) => {
    if (!out) return;
    Object.entries(p).forEach(([inn, pts]) => {
      if (lu.s.includes(inn) || !fits(SLOTS[k], posOf(inn))) return;
      const gain = Math.round((pts - (p[out] || 0)) * 100) / 100;
      if (gain > 0 && (!swap || gain > swap.gain)) swap = { gain, inn, inPts: pts, out, outPts: p[out] || 0 };
    });
  });
  return { actual, best, left: Math.round((best - actual) * 100) / 100, swap };
}

function weekCrimes(wk) {
  if (!wk.lineups) return null;
  const opp = {}, score = {};
  wk.games.forEach(g => { opp[g.a] = g.b; opp[g.b] = g.a; score[g.a] = g.as; score[g.b] = g.bs; });
  return IDS.filter(u => wk.lineups[u]).map(u => {
    const r = analyze(wk.lineups[u]);
    const lost = score[u] < score[opp[u]];
    return { u, ...r, week: wk.week, lost, cost: lost && r.best > score[opp[u]], opp: opp[u], oppScore: score[opp[u]] };
  });
}

function seasonCrimes(weeks) {
  const rows = Object.fromEntries(IDS.map(u => [u, { u, left: 0, actual: 0, best: 0, cost: 0 }]));
  const swaps = [];
  weeks.filter(w => w.status === "final" && w.lineups).forEach(wk => weekCrimes(wk).forEach(c => {
    const r = rows[c.u]; r.left += c.left; r.actual += c.actual; r.best += c.best; if (c.cost) r.cost++;
    if (c.swap) swaps.push({ ...c.swap, u: c.u, week: c.week });
  }));
  return {
    rows: Object.values(rows).map(r => ({ ...r, left: Math.round(r.left * 100) / 100 })).sort((a, b) => b.left - a.left),
    swaps: swaps.sort((a, b) => b.gain - a.gain)
  };
}

const crimeLine = (u, sw) => `${esc(nm(u))} started <strong>${esc(pname(sw.out))}</strong> (${f2(sw.outPts)}) over <strong>${esc(pname(sw.inn))}</strong> (${f2(sw.inPts)})`;

function finalLineupWeeks() { return state.data.weeks.filter(w => w.status === "final" && w.lineups); }
function weekPicker(list, cur, attr) {
  return `<div class="weeks" role="group" aria-label="Choose a week">${list.map(w =>
    `<button class="wk is-final" ${attr}="${w.week}" aria-pressed="${w.week === cur}" aria-label="Week ${w.week}">${w.week}</button>`).join("")}</div>`;
}

function renderCrimes() {
  const fw = finalLineupWeeks();
  if (!fw.length) return `<section class="card"><h2 class="h2">Bench Crimes</h2>${ticket("⏳", "The first rap sheet drops once Week 1 is final.")}</section>`;
  if (!fw.some(w => w.week === state.crimeWeek)) state.crimeWeek = fw[fw.length - 1].week;
  const { rows, swaps } = seasonCrimes(state.data.weeks);
  const through = fw[fw.length - 1].week;
  const live = state.data.weeks.find(w => w.status === "live");
  const rap = rows.map((r, i) => `<tr><td class="rank">${i + 1}</td>
    <td><span class="who">${avatar(r.u, 30)}${whoBlock(r.u)}</span></td>
    <td class="num"><span class="left">${f2(r.left)}</span></td>
    <td class="num">${r.best ? Math.round(r.actual / r.best * 100) : 100}%</td>
    <td class="num"><span class="ls${r.cost ? "" : " zero"}">${r.cost}</span></td></tr>`).join("");
  const shame = swaps.slice(0, 5).map(sw => `<li><p>${crimeLine(sw.u, sw)} <span class="luck">Week ${sw.week}</span></p><span class="gain">+${f2(sw.gain)}</span></li>`).join("");
  const wk = state.data.weeks[state.crimeWeek - 1];
  const list = weekCrimes(wk).sort((a, b) => b.left - a.left).map(c => `<li>
      <div class="top"><span class="who">${avatar(c.u, 30)}${whoBlock(c.u)}</span>${c.cost ? `<span class="flag">🤦 Cost them the W</span>` : ""}
      <span class="nums">${f2(c.actual)} of ${f2(c.best)} possible<b>−${f2(c.left)}</b></span></div>
      ${c.swap ? `<p class="why">Worst call: ${crimeLine(c.u, c.swap)}.${c.cost ? ` Best lineup (${f2(c.best)}) beats ${esc(nm(c.opp))}'s ${f2(c.oppScore)}.` : ""}</p>` : `<p class="why clean">Perfect lineup. No crimes committed.</p>`}
    </li>`).join("");
  return `<section class="card"><h2 class="h2">Season rap sheet</h2>
      <p class="note">Points left on the bench compared to each manager's best possible lineup, through Week ${through}.${live ? ` Week ${live.week} gets added when it's final.` : ""}</p>
      <div class="table-wrap"><table class="rap"><thead><tr><th class="num">#</th><th>Manager</th><th class="num">Left on bench</th><th class="num">Efficiency</th><th class="num">L's caused</th></tr></thead><tbody>${rap}</tbody></table></div>
      <p class="foot">Efficiency is points scored divided by the best possible score. "L's caused" counts losses the best lineup would have won.</p></section>
    <section class="card"><h2 class="h2">Hall of Shame</h2><p class="note">The five worst single start/sit calls of the season.</p><ol class="shame">${shame}</ol></section>
    <section class="card"><h2 class="h2">Week ${wk.week} lineup review</h2>${weekPicker(fw, wk.week, "data-cweek")}<ul class="perp">${list}</ul>
      <p class="foot">Best lineup uses the same slots (QB, 2 RB, 2 WR, TE, FLEX, K, DEF) and whoever was on the roster when the week closed.</p></section>`;
}

function weekAwards(wk) {
  const out = [];
  const f = weekFacts(wk);
  const crimes = wk.lineups ? weekCrimes(wk) : null;
  const one = arr => arr[0];
  const and = (arr, fn) => arr.length > 1 ? `${fn(arr[0])} and ${arr.length - 1} ${arr.length === 2 ? "other" : "others"}` : fn(arr[0]);
  out.push({ e: "👑", t: "Manager of the Week", u: f.top[0].u, stat: f2(f.top[0].pts), d: `Top score in the league. Collects $${L.weeklyBet}.`, hero: true });
  out.push({ e: "🧾", t: "Paying the $5", u: f.bottom[0].u, stat: f2(f.bottom[0].pts), d: `Lowest score of the week. Venmo ${nm(f.top[0].u)}.` });
  if (crimes) {
    const starters = [], bench = [];
    IDS.forEach(u => { const lu = wk.lineups[u]; if (!lu) return;
      Object.entries(lu.p).forEach(([id, pts]) => (lu.s.includes(id) ? starters : bench).push({ u, id, pts })); });
    const mvp = starters.reduce((a, b) => b.pts > a.pts ? b : a);
    out.push({ e: "🔥", t: "Player of the Week", u: mvp.u, stat: f2(mvp.pts), d: `${pname(mvp.id)} (${posOf(mvp.id)}) went off for ${nm(mvp.u)}.` });
    const bw = bench.reduce((a, b) => b.pts > a.pts ? b : a);
    out.push({ e: "🪑", t: "Bench Warmer of the Week", u: bw.u, stat: f2(bw.pts), d: `${pname(bw.id)} did all that from ${nm(bw.u)}'s bench.` });
    const skill = starters.filter(x => !["K","DEF"].includes(posOf(x.id)));
    const low = Math.min(...skill.map(x => x.pts));
    const ghosts = skill.filter(x => x.pts === low);
    out.push({ e: "🫥", t: "Ghost of the Week", u: ghosts[0].u, stat: f2(low), d: ghosts.length > 1 ? `${and(ghosts, g => `${pname(g.id)} (${nm(g.u)})`)} all started and did nothing.` : `${pname(ghosts[0].id)} started for ${nm(ghosts[0].u)} and did nothing.` });
    const coach = crimes.slice().sort((a, b) => (b.actual / b.best) - (a.actual / a.best) || b.actual - a.actual)[0];
    out.push({ e: "🎯", t: "Coach of the Week", u: coach.u, stat: `${Math.round(coach.actual / coach.best * 100)}%`, d: coach.left ? `Only ${f2(coach.left)} points left on the bench.` : "Set the perfect lineup." });
    const crime = crimes.filter(c => c.swap).sort((a, b) => b.swap.gain - a.swap.gain)[0];
    if (crime) out.push({ e: "🚨", t: "Bench Crime of the Week", u: crime.u, stat: `+${f2(crime.swap.gain)}`, d: `Started ${pname(crime.swap.out)} (${f2(crime.swap.outPts)}) over ${pname(crime.swap.inn)} (${f2(crime.swap.inPts)}).` });
  }
  const games = wk.games.map(g => { const aw = g.as >= g.bs; return { w: aw ? g.a : g.b, l: aw ? g.b : g.a, ws: Math.max(g.as, g.bs), ls: Math.min(g.as, g.bs), m: Math.abs(g.as - g.bs) }; }).filter(g => g.m > 0);
  if (games.length) {
    const close = games.reduce((a, b) => b.m < a.m ? b : a), blow = games.reduce((a, b) => b.m > a.m ? b : a);
    out.push({ e: "😅", t: "Great Escape", u: close.w, stat: `+${f2(close.m)}`, d: `Survived ${nm(close.l)} by the thinnest margin of the week.` });
    out.push({ e: "💀", t: "Beatdown of the Week", u: blow.w, stat: `+${f2(blow.m)}`, d: `Ran ${nm(blow.l)} off the field, ${f2(blow.ws)} to ${f2(blow.ls)}.` });
    const heart = games.reduce((a, b) => b.ls > a.ls ? b : a), lucky = games.reduce((a, b) => b.ws < a.ws ? b : a);
    out.push({ e: "😭", t: "Heartbreaker", u: heart.l, stat: f2(heart.ls), d: `Highest score in a loss. ${nm(heart.w)} just had more.` });
    out.push({ e: "🍀", t: "Lucky Duck", u: lucky.w, stat: f2(lucky.ws), d: `Lowest score to win a game. Thank ${nm(lucky.l)}.` });
  }
  return out;
}

function renderAwards() {
  const d = state.data;
  const finals = d.weeks.filter(w => w.status === "final" && w.games.length);
  if (!finals.length) return `<section class="card"><h2 class="h2">Weekly Awards</h2>${ticket("⏳", "Awards drop once Week 1 is final.")}</section>`;
  if (!finals.some(w => w.week === state.awardWeek)) state.awardWeek = finals[finals.length - 1].week;
  const wk = d.weeks[state.awardWeek - 1];
  const live = d.weeks.find(w => w.status === "live");
  const cards = weekAwards(wk).map(a => `<article class="award${a.hero ? " hero-award" : ""}">
      <span class="award-emoji" aria-hidden="true">${a.e}</span><h3 class="award-title">${esc(a.t)}</h3>
      <span class="who">${avatar(a.u, 36)}${whoBlock(a.u)}</span>
      <span class="award-stat">${esc(a.stat)}</span><p class="award-detail">${esc(a.d)}</p></article>`).join("");
  return `<section class="card"><h2 class="h2">Week ${wk.week}</h2>
      <p class="note">Handed out automatically once a week goes final.${live ? ` Week ${live.week} awards drop when it's over.` : ""}</p>
      ${weekPicker(finals, wk.week, "data-aweek")}</section>
    <div class="awards">${cards}</div>`;
}

function renderFun() {
  return `<h2 class="section-head">🏆 Weekly Awards</h2>${renderAwards()}<h2 class="section-head">🚨 Bench Crimes</h2>${renderCrimes()}`;
}

function render() {
  if (!state.data) return;
  renderTop();
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === state.tab)));
  const v = document.getElementById("view");
  v.innerHTML = state.tab === "week" ? renderWeek() : state.tab === "standings" ? renderStandings() : state.tab === "fun" ? renderFun() : renderMoney();
  v.querySelectorAll("[data-week]").forEach(b => b.onclick = () => { state.week = Number(b.dataset.week); render(); });
  v.querySelectorAll("[data-cweek]").forEach(b => b.onclick = () => { state.crimeWeek = Number(b.dataset.cweek); render(); });
  v.querySelectorAll("[data-aweek]").forEach(b => b.onclick = () => { state.awardWeek = Number(b.dataset.aweek); render(); });
}

function pickWeek() {
  if (state.picked) return;
  const w = state.data.weeks;
  const live = w.find(x => x.status === "live");
  const finals = w.filter(x => x.status === "final");
  state.week = live ? live.week : finals.length ? finals[finals.length - 1].week : 1;
  state.picked = true;
}

async function load() {
  state.loading = true; if (state.data) renderTop();
  try {
    state.data = await fromSleeper();
    state.source = "live";
  } catch {
    if (state.source !== "live") { state.data = fromSnapshot(); state.source = "saved"; }
  }
  state.loading = false;
  pickWeek(); render();
}

document.querySelectorAll(".tab").forEach(b => b.onclick = () => { state.tab = b.dataset.tab; render(); });

const themeBtn = document.getElementById("theme");
function applyTheme(t) {
  if (t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme");
  const dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  themeBtn.textContent = dark ? "☀️ Light mode" : "🌙 Dark mode";
  themeBtn.setAttribute("aria-pressed", String(dark));
}
applyTheme(store.get("cousins-theme"));
themeBtn.onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  store.set("cousins-theme", next); applyTheme(next);
};

state.data = fromSnapshot(); pickWeek(); render();
load();
setInterval(() => { if (state.source === "live" && !document.hidden) load(); }, 90000);
</script>
</body>
</html>
